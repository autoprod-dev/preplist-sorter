<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Prepline Pipeline · Autoprod prototype</title>
<style>
:root{--acc:#1f4e8c;--ok:#2e7d5b;--mut:#5b6476;--line:#dde2ea}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fa;color:#1d2433}
header{background:linear-gradient(90deg,#14305a,#1f4e8c);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}.badge{font-size:11px;background:#ffffff26;padding:3px 8px;border-radius:10px}.brand{margin-left:auto;font-weight:700}
nav{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font:inherit;cursor:pointer;color:var(--mut)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}nav button.done{border-color:var(--ok);color:var(--ok)}nav button.on.done{color:#fff;border-color:var(--acc)}nav button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1100px;margin:0 auto;padding:16px}.page{display:none}.page.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}h2{margin:0 0 6px;color:var(--acc);font-size:22px}
.drop{border:2px dashed #9fb3d1;border-radius:12px;padding:22px;text-align:center;background:#f8fbff;cursor:pointer}.drop.over{background:#e3eefc;border-color:var(--acc)}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}.btn.sec{background:#e8edf5;color:#1d2433}.btn.demo{background:#c26a00}
.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.mut{color:var(--mut)}.err{color:#b3261e;font-weight:600}.ok{color:var(--ok);font-weight:600}
ul.files{padding-left:18px}.scroll{overflow:auto;max-height:420px}table{border-collapse:collapse;font-size:12.5px}td,th{border:1px solid var(--line);padding:3px 7px;text-align:left;white-space:nowrap}th{background:#eef2f8}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:12px}iframe{width:100%;height:860px;border:1px solid var(--line);border-radius:10px;background:#fff}
@media(max-width:640px){main{padding:10px}h2{font-size:18px}iframe{height:700px}}
@media print{header,nav,.noprint,.drop,.pager{display:none!important}.page:not(.on){display:none!important}.scroll{max-height:none;overflow:visible}body{background:#fff}.card{border:0}}
</style></head><body>
<header><h1>Prepline Pipeline</h1><span class="badge">PROTOTYPE · demo data only</span><span class="brand">Autoprod</span></header>
<nav id="steps" class="noprint"></nav><main id="main"></main>
<script src="../gate-config.js"></script><script src="../gate.js"></script>
<script src="sorter/vendor/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGES=[
 {id:'wo',t:'Work orders',h:'Upload work orders',p:'Your own section work orders (Larder, Sauce, Plated…), as produced by your kitchen system. Excel, CSV or PDF; several files at once. No conversion is done: they are read as they are.',acc:'.xlsx,.xls,.csv,.pdf',demo:['WorkOrder_Larder_DEMO.SYNTHETIC.xlsx','WorkOrder_Sauce_DEMO.SYNTHETIC.xlsx','WorkOrder_Plated_DEMO.SYNTHETIC.xlsx']},
 {id:'roster',t:'Rosters',h:'Upload rosters',p:'The roster for the same week (Excel or CSV download of the roster sheet). Several files allowed.',acc:'.xlsx,.xls,.csv',demo:['roster-demo.SYNTHETIC.csv']},
 {id:'pt',t:'Production tools + POs',h:'Upload production tools and POs',p:'The week\'s production tool PDFs and their matching PO PDFs, together in one drop: each file is auto-detected as a production tool or a PO, and every ingredient is paired with its PO line to fill the Ref # (supplier and delivery date).',acc:'.pdf',demo:['PT-demo-larder-sauce.SYNTHETIC.pdf','PO-demo-larder.SYNTHETIC.pdf','PO-demo-sauce.SYNTHETIC.pdf']},
 {id:'prep',t:'Prep list',h:'Prep list conversion',p:'Upload a prep list spreadsheet or production tool PDFs (with or without POs) straight here, no earlier steps needed. Or convert the production tools + POs already added in step 3. Uses the existing Prepline sorter unchanged; then sort, edit and print as usual.',acc:'.xlsx,.xls,.csv,.pdf',demo:['Preplist_DEMO.SYNTHETIC.xlsx']}];
const F={wo:[],roster:[],pt:[],po:[],prep:[]},T={};let cur=0,converted=false;
const doneStage=i=>i<3?F[STAGES[i].id].length>0:converted;const OPT='<span class="mut"> (optional)</span>';
function nav(){$('steps').innerHTML=STAGES.map((s,i)=>`<button id="nav-${s.id}" class="${i===cur?'on':''} ${doneStage(i)?'done':''}" onclick="go(${i})">${i+1}. ${s.t}${doneStage(i)?' ✓':''}</button>`).join('');
 STAGES.forEach((s,i)=>{const n=$('next-'+s.id);if(n)n.textContent=(doneStage(i)?'Next: ':'Skip to ')+STAGES[i+1].t+' →';});}
function go(i){cur=i;document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',j===i));nav();if(STAGES[i].id==='prep')initSorter();scrollTo(0,0);}
$('main').innerHTML=STAGES.map((s,i)=>`<section class="page" id="page-${s.id}"><div class="card"><h2>Step ${i+1} of ${STAGES.length} · ${s.h}${OPT}</h2><p class="mut">${s.p}</p>
${s.acc&&s.id!=='prep'?`<div class="drop" id="drop-${s.id}" tabindex="0" role="button" aria-label="Drop files or click to choose">Drag files here, or <b>click to choose</b><br><span class="mut">${s.acc}</span><input type="file" id="file-${s.id}" multiple accept="${s.acc}" hidden></div>
<div class="row noprint"><button class="btn demo" id="demo-${s.id}" onclick="loadDemo('${s.id}')">Use demo files</button><button class="btn sec" id="clear-${s.id}" onclick="clearFiles('${s.id}')">Clear</button><button class="btn sec" id="print-${s.id}" onclick="window.print()">Print</button></div>
<div id="msg-${s.id}"></div><div id="list-${s.id}"></div><div id="prev-${s.id}"></div>`:
`<div class="drop" id="drop-prep" tabindex="0" role="button" aria-label="Drop files or click to choose">Drag a prep list spreadsheet or production tool PDFs (+ POs) here, or <b>click to choose</b><br><span class="mut">${s.acc}</span><input type="file" id="file-prep" multiple accept="${s.acc}" hidden></div>
<div class="row noprint"><button class="btn demo" id="demo-prep" onclick="loadDemo('prep')">Use demo spreadsheet</button><button class="btn" id="convert" onclick="convert()">Convert files from step 3</button><button class="btn sec" id="print-prep" onclick="printPrep()">Print prep list</button><span id="msg-prep" class="mut"></span></div><div id="sumprep" class="mut"></div><iframe id="sorter" title="Prep list sorter"></iframe>`}${s.id==='pt'?'<div id="pair-pt"></div>':''}
<div class="pager"><button class="btn sec" onclick="go(${Math.max(0,i-1)})" ${i?'':'disabled'}>← Back</button>${i<STAGES.length-1?`<button class="btn" id="next-${s.id}" onclick="go(${i+1})">Skip to ${STAGES[i+1].t} →</button>`:''}</div></div></section>`).join('');
async function addFiles(id,list){if(id==='prep')return prepUpload(list);if(id==='pt'||id==='po')return addPdfs(id,list);const s=STAGES.find(x=>x.id===id),ok=s.acc.split(','),bad=[];
 for(const f of list){const ext='.'+f.name.split('.').pop().toLowerCase();if(!ok.includes(ext)){bad.push(f.name);continue;}if(!F[id].some(x=>x.name===f.name&&x.size===f.size))F[id].push(f);}
 $('msg-'+id).innerHTML=bad.length?`<p class="err">Not accepted here (${esc(s.acc)}): ${bad.map(esc).join(', ')}</p>`:'';if(id==='pt'||id==='po')converted=false;await render(id);nav();}
function clearFiles(id){F[id]=[];T[id]=null;converted=false;if(id==='pt'){F.po=[];T.po=null;}if(id==='pt')pairing();$('msg-'+id).innerHTML='';render(id);nav();}
// 4.1.1: big workbooks (e.g. a roster with ~400 weekly sheets, some 16,384 columns wide) no longer hang the page:
// only the first 301 rows of at most 6 sheets are read (newest dated sheets first), empty columns are trimmed,
// and each file is read once.
const SHEET_CACHE=new WeakMap(),MAX_SHEETS=6,MAX_ROWS=302;
function sheetDate(n){const m=String(n).match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);if(!m)return '';return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
function trimSheet(ws){if(!ws||!ws['!ref'])return ws;let mr=0,mc=0;for(const k in ws){if(k[0]==='!')continue;const v=ws[k];if(v==null||v.v===''||v.v==null)continue;const a=XLSX.utils.decode_cell(k);if(a.r>mr)mr=a.r;if(a.c>mc)mc=a.c;}ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});return ws;}
async function readSheet(f){if(SHEET_CACHE.has(f))return SHEET_CACHE.get(f);const buf=await f.arrayBuffer();let names=XLSX.read(buf,{bookSheets:true}).SheetNames,more=0;
 if(names.length>MAX_SHEETS){const dated=names.filter(n=>sheetDate(n)).sort((a,b)=>sheetDate(b).localeCompare(sheetDate(a)));const pick=(dated.length?dated:names).slice(0,MAX_SHEETS);more=names.length-pick.length;names=pick;}
 const wb=XLSX.read(buf,{cellDates:true,sheets:names,sheetRows:MAX_ROWS});
 const out=names.map(n=>({n,rows:XLSX.utils.sheet_to_json(trimSheet(wb.Sheets[n]),{header:1,defval:'',raw:false}).filter(r=>r.some(c=>String(c).trim()))}));
 if(more)out.more=more;SHEET_CACHE.set(f,out);return out;}
async function render(id){if(!$('list-'+id))return;const fs=F[id];$('list-'+id).innerHTML=fs.length?`<ul class="files">${fs.map(f=>`<li>${esc(f.name)} <span class="mut">(${(f.size/1024).toFixed(0)} KB)</span></li>`).join('')}</ul>`:'<p class="mut">No files yet.</p>';
 let h='';for(const f of fs){if(/\.pdf$/i.test(f.name)){h+=`<h3>${esc(f.name)}</h3><p class="mut">PDF ready${id==='wo'?' (shown as is)':' for the prep list conversion (step 5)'}.</p>`;continue;}
  try{const sh=await readSheet(f);if(sh.more)h+=`<p class="mut">${esc(f.name)}: showing the ${sh.length} newest sheets; ${sh.more} more sheet(s) not shown.</p>`;for(const {n,rows} of sh){if(!rows.length)continue;h+=`<h3>${esc(f.name)} · ${esc(n)} <span class="mut">(${rows.length-1} rows)</span></h3><div class="scroll"><table>${rows.slice(0,301).map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`;}}
  catch(e){h+=`<p class="err">Could not read ${esc(f.name)}: ${esc(e.message)}</p>`;}}
 $('prev-'+id).innerHTML=h;}
async function loadDemo(id){const s=STAGES.find(x=>x.id===id);const fs=await Promise.all(s.demo.map(async n=>{const r=await fetch('samples/'+n);return new File([await r.blob()],n);}));await addFiles(id,fs);}
STAGES.filter(s=>s.acc).forEach(s=>{const d=$('drop-'+s.id),inp=$('file-'+s.id);
 d.onclick=e=>{if(e.target!==inp)inp.click();};d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();}};inp.onchange=()=>{addFiles(s.id,[...inp.files]);inp.value='';};
 d.ondragover=e=>{e.preventDefault();d.classList.add('over');};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');addFiles(s.id,[...e.dataTransfer.files]);};});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());
let sorterReady=null;function initSorter(){if(sorterReady)return sorterReady;const fr=$('sorter');sorterReady=new Promise(r=>{fr.onload=()=>r(fr.contentWindow);});fr.src='sorter/index.html';return sorterReady;}
async function convert(){const files=[...F.pt,...F.po];if(!F.pt.length){$('msg-prep').textContent='No production tools added yet: drop a spreadsheet or PDFs above instead.';return;}
 $('convert').disabled=true;$('msg-prep').textContent='Converting…';const w=await initSorter();
 for(let i=0;i<80&&!(typeof w.routeFiles==='function');i++)await new Promise(r=>setTimeout(r,100));
 if(typeof w.routeFiles!=='function'){sorterReady=null;$('convert').disabled=false;$('msg-prep').innerHTML=READER_ERR;return;}
 w.routeFiles(files.map(f=>new File([f],f.name,{type:'application/pdf'})));
 let last=-1,same=0;for(let n=0;n<240;n++){await new Promise(r=>setTimeout(r,250));const c=w.eval('typeof ROWS==="undefined"?0:ROWS.length');same=(c===last&&c>0)?same+1:0;last=c;if(same>=6)break;}
 const nr=w.eval('typeof ROWS==="undefined"?0:ROWS.length');converted=nr>0;$('convert').disabled=false;$('msg-prep').textContent=converted?`Prep list ready: ${nr} lines from ${F.pt.length} production tool file(s) and ${F.po.length} PO file(s).`:'No prep lines found. Check the production tool files.';nav();}
async function printPrep(){const w=await initSorter();if(!converted){$('msg-prep').textContent='Convert first.';return;}if(typeof w.printMasterSummary==='function')w.printMasterSummary();else w.print();}
// v2: mixed PT/PO detection + pairing (helper copy of the unchanged sorter, hidden)
let helperReady=null;function helper(){if(helperReady)return helperReady;const fr=document.createElement('iframe');fr.id='helper';fr.title='helper';fr.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;border:0';document.body.appendChild(fr);
 helperReady=new Promise((r,j)=>{fr.onload=async()=>{let w=null;try{w=fr.contentWindow;for(let i=0;i<100&&typeof w.splitPoFiles!=='function';i++)await new Promise(q=>setTimeout(q,100));}catch(e){}if(w&&typeof w.splitPoFiles==='function')r(w);else{helperReady=null;fr.remove();j(new Error('reader not loaded'));}};});fr.src='sorter/index.html';return helperReady;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const READER_ERR='<p class="err">The PDF reader could not load (are you offline? Open this page once while online so it works offline). Check your connection, then add the files again.</p>';
async function addPdfs(id,list){try{return await addPdfs0(id,list);}catch(e){$('msg-'+id).innerHTML=READER_ERR;const el=$('pair-pt');if(el)el.innerHTML='';}}
async function addPdfs0(id,list){const bad=[],pdfs=[];for(const f of list){/\.pdf$/i.test(f.name)?pdfs.push(f):bad.push(f.name);}
 $('msg-'+id).innerHTML=bad.length?`<p class="err">Not accepted here (.pdf): ${bad.map(esc).join(', ')}</p>`:'';if(!pdfs.length)return;
 $('msg-'+id).innerHTML+='<p class="mut">Detecting production tools vs POs…</p>';const w=await helper();
 const {pts,pos}=await w.splitPoFiles(pdfs.map(f=>new File([f],f.name,{type:'application/pdf'})));const poNames=pos.map(p=>p.file||p.name||'');
 const isPt=new Set(pts.map(f=>f.name));let np=0,no=0;
 for(const f of pdfs){const k=isPt.has(f.name)?'pt':'po';const o=k==='pt'?'po':'pt';F[o]=F[o].filter(x=>!(x.name===f.name&&x.size===f.size));if(!F[k].some(x=>x.name===f.name&&x.size===f.size))F[k].push(f);k==='pt'?np++:no++;}
 $('msg-'+id).innerHTML=(bad.length?`<p class="err">Not accepted here (.pdf): ${bad.map(esc).join(', ')}</p>`:'')+`<p class="ok" id="detect-${id}">Auto-detected: ${np} production tool file(s), ${no} PO file(s).</p>`;
 converted=false;await render('pt');nav();await pairing();}
async function pairing(){try{return await pairing0();}catch(e){const el=$('pair-pt');if(el)el.innerHTML=READER_ERR;}}
async function pairing0(){const el=$('pair-pt');if(!el)return;if(!F.pt.length){el.innerHTML='';return;}
 el.innerHTML='<p class="mut">Pairing ingredients with PO lines…</p>';const w=await helper();
 w.eval('POS=[];savePOs();');if(F.po.length)await w.splitPoFiles(F.po.map(f=>new File([f],f.name,{type:'application/pdf'})));
 w.eval('ROWS=[];');w.routeFiles(F.pt.map(f=>new File([f],f.name,{type:'application/pdf'})),{__poSplit:true});
 let last=-1,same=0;for(let n=0;n<240;n++){await wait(250);const c=w.eval('ROWS.length');same=(c===last&&c>0)?same+1:0;last=c;if(same>=6)break;}
 const rows=JSON.parse(w.eval(`JSON.stringify((()=>{const seen={},out=[];ROWS.forEach(r=>{const k=ingKey(r.task);if(seen[k])return;seen[k]=1;const m=poMatchFor(r.task);out.push({dish:cleanDishName(r.dish),task:r.task,st:m?m.status:'nopo',ref:m&&m.item?poBoxText(m.item):'',line:m&&m.item?(m.item.desc||''):''});});return out;})())`));
 const n=rows.filter(r=>r.ref).length,lab={ok:'paired',check:'check',none:'no PO line',sub:'made in-house',nopo:'no POs added'};
 el.innerHTML=`<h3 id="pair-sum">PT ↔ PO pairing: ${n} of ${rows.length} ingredients have a Ref # from ${F.po.length} PO file(s)</h3><p class="mut" id="po-files">POs: ${F.po.map(f=>esc(f.name)).join(', ')||'none yet'}</p><div class="scroll"><table id="pair-table"><tr><th>Dish</th><th>Ingredient</th><th>Ref # (filled)</th><th>PO line</th><th>Match</th></tr>${rows.map(r=>`<tr><td>${esc(r.dish)}</td><td>${esc(r.task)}</td><td>${esc(r.ref)}</td><td>${esc(r.line)}</td><td>${lab[r.st]||r.st}</td></tr>`).join('')}</table></div>`;}
async function prepUpload(list){const ok=['.xlsx','.xls','.csv','.pdf'],bad=[],fs=[];for(const f of list){ok.includes('.'+f.name.split('.').pop().toLowerCase())?fs.push(f):bad.push(f.name);}
 if(!fs.length){$('msg-prep').innerHTML=`<span class="err">Not accepted here: ${bad.map(esc).join(', ')}</span>`;return;}
 const pdfs=fs.filter(f=>/\.pdf$/i.test(f.name)),sheet=fs.find(f=>!/\.pdf$/i.test(f.name));F.prep=fs;
 $('msg-prep').textContent='Converting…';const w=await initSorter();for(let i=0;i<80&&typeof w.routeFiles!=='function';i++)await wait(100);
 w.eval('ROWS=[];');if(pdfs.length)w.routeFiles(pdfs.map(f=>new File([f],f.name,{type:'application/pdf'})));else w.routeFiles([sheet]);
 let last=-1,same=0;for(let n=0;n<240;n++){await wait(250);const c=w.eval('typeof ROWS==="undefined"?0:ROWS.length');same=(c===last&&c>0)?same+1:0;last=c;if(same>=6)break;}
 const nr=w.eval('ROWS.length');converted=nr>0;$('msg-prep').textContent=converted?`Prep list ready: ${nr} lines from ${pdfs.length?pdfs.length+' uploaded PDF(s)':'spreadsheet '+sheet.name}.`:'No prep lines found in that file.';if(bad.length)$('msg-prep').textContent+=' Skipped: '+bad.join(', ');nav();}
go(0);
</script></body></html>
